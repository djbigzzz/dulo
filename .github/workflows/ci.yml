# Lint, typecheck, test and build on every push and pull request.
# No database is needed: `prisma generate` (postinstall) only reads the schema, and every
# DB-touching module is mocked in tests. The env below is the same dummy set tests/siws.test.ts
# uses; JWT_SECRET must be >= 32 and CRON_SECRET >= 16 characters or env() refuses to parse.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      DIRECT_URL: postgresql://test:test@localhost:5432/test
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
      CRON_SECRET: ci-only-cron-secret-16
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_NAME: Dulo
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The lockfile must be read by the same npm that wrote it. Node 24's bundled npm moved to
      # 12.x, which resolves a few transitive deps differently (a newer @emnapi, the optional ws
      # helpers bufferutil and utf-8-validate) and then refuses `npm ci` as "out of sync" against
      # a lock written by 11.x. That was the whole reason this badge stayed red. Bump this and
      # package.json#packageManager together, and regenerate the lock with that version.
      - name: Pin npm to the version that wrote package-lock.json
        run: npm install -g npm@11.6.2 && npm --version

      # Actions logs need a sign-in to read even on a public repo, so on failure npm's own error
      # lines go into the public job summary. The FIRST lines: the tail is just usage text.
      - name: Install (npm ci runs postinstall = prisma generate)
        run: |
          set -o pipefail
          npm ci 2>&1 | tee /tmp/npm-ci.log || {
            {
              echo "### npm ci failed"
              echo '```'
              grep -E '^npm (error|ERR)' /tmp/npm-ci.log | grep -vE '^npm error ( *$|Usage:|Options:|\[|-|aliases:|Run "npm help)' | head -n 40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

      - name: Lint
        run: npm run lint

      # next-env.d.ts and .next/types are gitignored; `next typegen` (Next 15.5+) creates them
      # without a build so `tsc --noEmit` sees the route types. Skipped on older Next.
      - name: Generate Next.js types
        run: npx next typegen || echo "next typegen unavailable on this Next version; skipping"

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Catches build-only breaks (route export validation, prerender errors) that tsc and vitest miss.
      # Same dummy env; VERCEL_ENV is unset here, so next.config's production APP_URL guard stays off.
      - name: Build
        run: npm run build
