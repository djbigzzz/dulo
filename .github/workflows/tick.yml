# Cron tick pinger — the Vercel HOBBY fallback. STAYS DISABLED unless enabled in repo settings.
#
# Production runs on Vercel Hobby (daily crons only): vercel.json schedules /api/cron/tick once a
# day at 21:10 UTC, and this workflow, enabled there, asks for a tick every 5 minutes. It sends the
# same `Authorization: Bearer <CRON_SECRET>` header Vercel Cron sends and fails the run unless every
# step reports ok. On Vercel Pro, set vercel.json to */5 and leave this disabled.
#
# The job is gated on a repository VARIABLE so the schedule is inert until someone opts in:
#   Settings -> Secrets and variables -> Actions
#     Variables: TICK_PINGER_ENABLED = true            (delete it, or set anything else, to disable)
#                APP_URL             = https://<project>.vercel.app (the deployed origin, no trailing slash;
#                                      production uses its public origin, https://projectdulo.com)
#     Secrets:   CRON_SECRET         = the same value as the Vercel env var
# On Hobby, keep vercel.json at its daily "10 21 * * *" (after the Friday settle in summer and
# winter time) and this at */5. GitHub runs scheduled workflows late or skips them under load:
# in production the median gap between runs has been about 4.75 hours, so ticks land hours
# apart. Sign-in and Refresh read a player's wallets at once, and the prediction and competition
# boards run an overdue settlement or rollover when read (src/lib/cron/catch-up.ts).
#
# Manual run: Actions -> "Cron tick (Hobby fallback)" -> Run workflow (also respects the variable).
name: Cron tick (Hobby fallback)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: cron-tick
  cancel-in-progress: false

jobs:
  tick:
    # Inert until the repository variable is set (see the header comment).
    if: ${{ vars.TICK_PINGER_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: ${{ vars.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Check configuration
        run: |
          test -n "$APP_URL" || { echo "::error::APP_URL repository variable is not set"; exit 1; }
          test -n "$CRON_SECRET" || { echo "::error::CRON_SECRET repository secret is not set"; exit 1; }

      # --max-time matches the route's maxDuration (300s). The secret travels in the header only;
      # a query-string secret is refused in production because it would land in request logs.
      - name: Poke /api/cron/tick
        run: |
          curl -fsS --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Accept: application/json" \
            "$APP_URL/api/cron/tick" > tick.json
          jq '.data.health' tick.json
          jq -e '.data.steps | all(.ok)' tick.json > /dev/null \
            || { echo "::error::a tick step failed"; jq '.data.steps[] | select(.ok | not)' tick.json; exit 1; }
